<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Debt Ledger</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --whatsapp: #25d366;
      --whatsapp-hover: #1da851;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1rem 0.5rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 950px;
    }

    header {
      margin-bottom: 1.2rem;
    }

    h1 { font-size: 1.5rem; color: var(--accent); }

    form {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .full-width { grid-column: span 2; }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    input, button {
      width: 100%;
      padding: 0.75rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    .job-buttons-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    .job-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 0.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s ease;
    }

    .job-btn.selected {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .job-counts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 0.75rem;
      background: var(--bg);
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    button.btn-add {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    button.btn-add:hover { background: var(--accent-hover); }

    .table-responsive {
      overflow-x: auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    th, td {
      padding: 0.75rem 0.85rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: #111827;
      color: var(--accent);
      font-weight: 600;
    }

    tr:last-child td { border-bottom: none; }

    .amount { color: var(--danger); font-weight: 700; }

    .actions-cell {
      display: flex;
      gap: 0.4rem;
    }

    .btn-whatsapp {
      background: var(--whatsapp);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }

    .btn-whatsapp:hover {
      background: var(--whatsapp-hover);
    }

    .btn-delete {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 0.35rem 0.55rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .badge {
      display: inline-block;
      background: #334155;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-right: 0.2rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Debt Ledger</h1>
    </header>

    <form id="debt-form">
      <div class="full-width">
        <label for="person">Name</label>
        <input type="text" id="person" placeholder="Debtor Name" required />
      </div>

      <div class="full-width">
        <label for="amount">Amount Owed (₦)</label>
        <input type="number" id="amount" placeholder="0.00" step="0.01" required />
      </div>

      <div class="full-width">
        <label>Type of Job (Tap to select multiple)</label>
        <div class="job-buttons-grid">
          <div class="job-btn" data-job="Typing">Typing</div>
          <div class="job-btn" data-job="Reprinting">Reprinting</div>
          <div class="job-btn" data-job="Photocopy">Photocopy</div>
        </div>
      </div>

      <div class="full-width" id="dynamic-jobs-wrapper" style="display: none;">
        <label>Number of Jobs</label>
        <div class="job-counts-container" id="job-counts-container"></div>
      </div>

      <button type="submit" class="btn-add full-width">Save Debt Entry</button>
    </form>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>S/NO</th>
            <th>DATE</th>
            <th>NAME</th>
            <th>TYPE OF JOB & QTY</th>
            <th>AMOUNT OWED</th>
            <th>ACTIONS</th>
          </tr>
        </thead>
        <tbody id="debt-table-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    let debts = JSON.parse(localStorage.getItem('debt_records')) || [];
    let selectedJobs = new Set();

    const form = document.getElementById('debt-form');
    const jobButtons = document.querySelectorAll('.job-btn');
    const dynamicJobsWrapper = document.getElementById('dynamic-jobs-wrapper');
    const jobCountsContainer = document.getElementById('job-counts-container');
    const tableBody = document.getElementById('debt-table-body');

    jobButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const job = btn.dataset.job;
        if (selectedJobs.has(job)) {
          selectedJobs.delete(job);
          btn.classList.remove('selected');
        } else {
          selectedJobs.add(job);
          btn.classList.add('selected');
        }
        updateJobInputs();
      });
    });

    function updateJobInputs() {
      jobCountsContainer.innerHTML = '';

      if (selectedJobs.size > 0) {
        dynamicJobsWrapper.style.display = 'block';
        selectedJobs.forEach(job => {
          const div = document.createElement('div');
          div.innerHTML = `
            <label for="count-${job}">${job} Qty</label>
            <input type="number" id="count-${job}" min="1" value="1" required data-job="${job}" />
          `;
          jobCountsContainer.appendChild(div);
        });
      } else {
        dynamicJobsWrapper.style.display = 'none';
      }
    }

    function saveAndRender() {
      localStorage.setItem('debt_records', JSON.stringify(debts));
      render();
    }

    function generateWhatsAppMessage(debt) {
      const jobSummary = debt.jobs.map(j => `${j.type} (${j.count})`).join(', ');
      const formattedAmount = `₦${parseFloat(debt.amount).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      
      const text = `Hello ${debt.person},\n\nThis is a friendly reminder regarding your pending balance of *${formattedAmount}* for the following job(s) done on ${debt.date}:\n- ${jobSummary}\n\nPlease let me know when you will be able to settle this. Thank you!`;
      
      return `https://wa.me/?text=${encodeURIComponent(text)}`;
    }

    function render() {
      tableBody.innerHTML = '';

      debts.forEach((debt, index) => {
        const tr = document.createElement('tr');
        const jobsFormatted = debt.jobs.map(j => `<span class="badge">${j.type}: ${j.count}</span>`).join(' ');
        const formattedAmount = `₦${parseFloat(debt.amount).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        const waUrl = generateWhatsAppMessage(debt);

        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${debt.date}</td>
          <td>${debt.person}</td>
          <td>${jobsFormatted}</td>
          <td class="amount">${formattedAmount}</td>
          <td>
            <div class="actions-cell">
              <a class="btn-whatsapp" href="${waUrl}" target="_blank" rel="noopener">WhatsApp</a>
              <button class="btn-delete" onclick="deleteDebt(${index})">✕ Delete</button>
            </div>
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      if (selectedJobs.size === 0) {
        alert('Please tap to select at least one type of job.');
        return;
      }

      const person = document.getElementById('person').value;
      const amount = document.getElementById('amount').value;
      
      const countInputs = jobCountsContainer.querySelectorAll('input');
      const jobs = Array.from(countInputs).map(input => ({
        type: input.dataset.job,
        count: parseInt(input.value, 10) || 1
      }));

      debts.push({
        date: new Date().toLocaleDateString('en-GB'),
        person,
        jobs,
        amount
      });

      form.reset();
      selectedJobs.clear();
      jobButtons.forEach(btn => btn.classList.remove('selected'));
      jobCountsContainer.innerHTML = '';
      dynamicJobsWrapper.style.display = 'none';
      
      saveAndRender();
    });

    window.deleteDebt = (index) => {
      debts.splice(index, 1);
      saveAndRender();
    };

    render();
  </script>
</body>
</html>
